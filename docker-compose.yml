name: ovpn-burp

services:
  ovpn-burp:
    build: .
    image: ovpn-burp:local
    container_name: ovpn-burp
    hostname: ovpn-burp
    restart: "no"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    ports:
      - "${BIND_IP:-0.0.0.0}:${VPN_PORT:-1194}:${VPN_PORT:-1194}/${VPN_PROTO:-udp}"
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      lab:
        ipv4_address: 172.28.0.10

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
